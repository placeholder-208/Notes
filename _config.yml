title: 学习笔记
description: 个人技术笔记集合
lang: zh-CN
baseurl: "/Notes"
url: "https://placeholder-208.github.io"
timezone: Asia/Shanghai

collections:
  notes:
    output: true
    # Preserve existing URLs, including nested folders and .html extensions.
    permalink: /:collection/:path:output_ext

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-last-modified-at

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - tests
  - playwright.config.js
  - playwright-report
  - test-results
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - .bundle
