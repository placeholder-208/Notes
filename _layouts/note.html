---
layout: default
---
<div class="note-wrapper">
  <aside class="sidebar">
    <nav id="toc">
      <ul></ul>
    </nav>
    <p><a href="{{ '/' | relative_url }}">← 返回主页</a></p>
  </aside>
  <main class="content">
    <div id="note-content">
      {{ content }}
    </div>
  </main>
</div>

<script>
  (function() {
    const container = document.getElementById('note-content');
    const headings = container.querySelectorAll('h2');   // 改为 h2
    if (headings.length === 0) return;

    const sections = [];
    let currentHeading = null;
    let currentChildren = [];
    for (let node of container.childNodes) {
      if (node.nodeName === 'H2') {
        if (currentHeading) {
          sections.push({ heading: currentHeading, children: currentChildren });
        }
        currentHeading = node;
        currentChildren = [];
      } else {
        if (currentHeading) {
          currentChildren.push(node);
        }
      }
    }
    if (currentHeading) {
      sections.push({ heading: currentHeading, children: currentChildren });
    }

    container.innerHTML = '';

    sections.forEach((sec, idx) => {
      const div = document.createElement('div');
      div.className = 'chapter';
      div.id = 'chapter-' + (idx + 1);
      div.appendChild(sec.heading.cloneNode(true));
      sec.children.forEach(child => {
        div.appendChild(child.cloneNode(true));
      });
      container.appendChild(div);
    });

    const tocNav = document.querySelector('#toc ul');
    tocNav.innerHTML = '';
    sections.forEach((sec, idx) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#chapter-' + (idx + 1);
      a.textContent = sec.heading.textContent;
      a.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.chapter').forEach((el, i) => {
          el.style.display = (i === idx) ? 'block' : 'none';
        });
        history.pushState(null, '', '#chapter-' + (idx + 1));
      });
      li.appendChild(a);
      tocNav.appendChild(li);
    });

    const allChapters = document.querySelectorAll('.chapter');
    if (allChapters.length > 0) {
      allChapters.forEach((el, i) => {
        el.style.display = (i === 0) ? 'block' : 'none';
      });
    }

    window.addEventListener('load', function() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#chapter-')) {
        const index = parseInt(hash.replace('#chapter-', '')) - 1;
        if (!isNaN(index) && index >= 0 && index < sections.length) {
          document.querySelectorAll('.chapter').forEach((el, i) => {
            el.style.display = (i === index) ? 'block' : 'none';
          });
        }
      }
    });
  })();
</script>
