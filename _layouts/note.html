---
layout: default
---
<div class="note-wrapper">
  <aside class="sidebar">
    <nav id="toc">
      <ul></ul>
    </nav>
    <p><a href="{{ '/' | relative_url }}">← 返回主页</a></p>
  </aside>
  <main class="content">
    <div id="note-content">
      {{ content }}
    </div>
  </main>
</div>

<script>
  (function() {
    const container = document.getElementById('note-content');
    const children = container.children;
    const h2s = container.querySelectorAll('h2');
    if (h2s.length === 0) return;

    // ---- 1. 按 h2 分割章节 ----
    const sections = [];
    let currentSection = null;
    for (let i = 0; i < children.length; i++) {
      const node = children[i];
      if (node.tagName === 'H2') {
        if (currentSection) sections.push(currentSection);
        currentSection = {
          heading: node,
          elements: []
        };
      } else {
        if (currentSection) {
          currentSection.elements.push(node);
        }
      }
    }
    if (currentSection) sections.push(currentSection);

    // ---- 2. 重新渲染内容 ----
    container.innerHTML = '';
    sections.forEach((sec, idx) => {
      const div = document.createElement('div');
      div.className = 'chapter';
      div.dataset.chapter = idx;
      div.id = 'chapter-' + idx;
      div.appendChild(sec.heading.cloneNode(true));
      sec.elements.forEach(el => {
        div.appendChild(el.cloneNode(true));
      });
      container.appendChild(div);
    });

    // ---- 3. 辅助：从章节 DOM 提取 h3 ----
    function getSubHeadings(chapterDiv) {
      return Array.from(chapterDiv.querySelectorAll('h3'));
    }

    // ---- 4. 核心切换函数（修改部分） ----
    function showChapter(index) {
      // ---------- 新增：清除所有侧边栏的子标题列表 ----------
      document.querySelectorAll('#toc ul > li ul.sub-toc').forEach(el => el.remove());

      // 隐藏所有章节
      document.querySelectorAll('.chapter').forEach(el => {
        el.style.display = 'none';
      });
      // 显示目标章节
      const target = document.querySelector('.chapter[data-chapter="' + index + '"]');
      if (!target) return;
      target.style.display = 'block';

      // 更新侧边栏活跃状态
      document.querySelectorAll('#toc ul > li').forEach(li => {
        const liIndex = parseInt(li.dataset.chapter);
        li.classList.toggle('active', liIndex === index);
      });

      // 为当前章节生成子标题列表
      const subHeadings = getSubHeadings(target);
      const parentLi = document.querySelector('#toc ul > li[data-chapter="' + index + '"]');
      if (!parentLi) return;

      if (subHeadings.length === 0) return;

      const subUl = document.createElement('ul');
      subUl.className = 'sub-toc';
      subHeadings.forEach((h3, subIdx) => {
        const id = 'sub-' + index + '-' + subIdx;
        h3.id = id;

        const subLi = document.createElement('li');
        const subA = document.createElement('a');
        subA.href = '#' + id;
        subA.textContent = h3.textContent;
        subA.addEventListener('click', function(e) {
          e.preventDefault();
          showChapter(index);
          history.pushState(null, '', '#' + id);
          const targetEl = document.getElementById(id);
          if (targetEl) {
            setTimeout(() => targetEl.scrollIntoView({ behavior: 'smooth' }), 50);
          }
        });
        subLi.appendChild(subA);
        subUl.appendChild(subLi);
      });

      parentLi.appendChild(subUl);
    }

    // ---- 5. 生成侧边栏主链接 ----
    const tocNav = document.querySelector('#toc ul');
    tocNav.innerHTML = '';
    sections.forEach((sec, idx) => {
      const li = document.createElement('li');
      li.dataset.chapter = idx;
      const a = document.createElement('a');
      a.href = '#chapter-' + idx;
      a.textContent = sec.heading.textContent;
      a.addEventListener('click', function(e) {
        e.preventDefault();
        const index = parseInt(this.closest('li').dataset.chapter);
        showChapter(index);
        history.pushState(null, '', '#chapter-' + index);
      });
      li.appendChild(a);
      tocNav.appendChild(li);
    });

    // ---- 6. 默认显示第一章 ----
    if (sections.length > 0) {
      showChapter(0);
    }

    // ---- 7. 处理 URL hash ----
    window.addEventListener('load', function() {
      const hash = window.location.hash;
      if (hash) {
        let targetIdx = -1, subIdx = -1;
        if (hash.startsWith('#chapter-')) {
          targetIdx = parseInt(hash.replace('#chapter-', ''));
        } else if (hash.startsWith('#sub-')) {
          const parts = hash.replace('#sub-', '').split('-');
          targetIdx = parseInt(parts[0]);
          subIdx = parseInt(parts[1]);
        }
        if (!isNaN(targetIdx) && targetIdx >= 0 && targetIdx < sections.length) {
          showChapter(targetIdx);
          if (!isNaN(subIdx) && subIdx >= 0) {
            const targetEl = document.getElementById('sub-' + targetIdx + '-' + subIdx);
            if (targetEl) {
              setTimeout(() => targetEl.scrollIntoView({ behavior: 'smooth' }), 100);
            }
          }
        }
      }
    });
  })();
</script>
